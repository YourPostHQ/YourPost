name: Documentation

on:
  push:
    branches: [ main, master ]
    paths:
      - 'yourpost-docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'yourpost-docs/**'
      - '.github/workflows/docs.yml'

jobs:
  build-docs:
    name: Build Documentation Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'yourpost-docs/package-lock.json'

      - name: Install dependencies
        run: cd yourpost-docs && npm ci

      - name: Build documentation
        run: cd yourpost-docs && npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: documentation-site
          path: yourpost-docs/.next
          retention-days: 7
