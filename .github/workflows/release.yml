name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux (native x86_64, cross-compile aarch64, riscv64)
          - target: x86_64-linux
            zig_target: x86_64-linux
            os: ubuntu-latest
          - target: aarch64-linux
            zig_target: aarch64-linux
            os: ubuntu-latest
          - target: riscv64-linux
            zig_target: riscv64-linux
            os: ubuntu-latest
          # macOS
          - target: x86_64-macos
            zig_target: x86_64-macos
            os: macos-latest
          - target: aarch64-macos
            zig_target: aarch64-macos
            os: macos-latest
          # Windows
          - target: x86_64-windows
            zig_target: x86_64-windows
            os: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Install dynamic libraries for native x86_64 build
          sudo apt-get install -y libsqlite3-dev libssl-dev
          # Set ZIG_SYSTEM_LINKER_FLAGS to help Zig find system libraries
          echo "ZIG_SYSTEM_LINKER_FLAGS=-L/usr/lib/x86_64-linux-gnu -L/usr/lib/x86_64-linux-gnu -L/usr/lib" >> $GITHUB_ENV
          echo "ZIG_SYSTEM_INCLUDE_FLAGS=-I/usr/include/x86_64-linux-gnu -I/usr/include" >> $GITHUB_ENV
          # Install QEMU for cross-compilation
          sudo apt-get install -y qemu-user-static

      - name: Install dependencies (Linux cross-compile aarch64)
        if: runner.os == 'Linux' && matrix.zig_target == 'aarch64-linux'
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libsqlite3-dev:arm64 libssl-dev:arm64
          # Set paths for Zig to find ARM64 libraries
          echo "ZIG_SYSTEM_LINKER_FLAGS=-L/usr/aarch64-linux-gnu/lib -L/usr/lib/aarch64-linux-gnu" >> $GITHUB_ENV
          echo "ZIG_SYSTEM_INCLUDE_FLAGS=-I/usr/aarch64-linux-gnu/include -I/usr/include/aarch64-linux-gnu" >> $GITHUB_ENV

      - name: Install dependencies (Linux cross-compile riscv64)
        if: runner.os == 'Linux' && matrix.zig_target == 'riscv64-linux'
        run: |
          sudo dpkg --add-architecture riscv64
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu libsqlite3-dev:riscv64 libssl-dev:riscv64
          # Set paths for Zig to find RISCV64 libraries
          echo "ZIG_SYSTEM_LINKER_FLAGS=-L/usr/riscv64-linux-gnu/lib -L/usr/lib/riscv64-linux-gnu" >> $GITHUB_ENV
          echo "ZIG_SYSTEM_INCLUDE_FLAGS=-I/usr/riscv64-linux-gnu/include -I/usr/include/riscv64-linux-gnu" >> $GITHUB_ENV

      - name: Install dependencies (Linux cross-compile riscv64)
        if: runner.os == 'Linux' && matrix.zig_target == 'riscv64-linux'
        run: |
          sudo dpkg --add-architecture riscv64
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu libsqlite3-dev:riscv64 libssl-dev:riscv64
          # Set paths for Zig to find RISCV64 libraries
          echo "ZIG_SYSTEM_LINKER_FLAGS=-L/usr/riscv64-linux-gnu/lib -L/usr/lib/riscv64-linux-gnu" >> $GITHUB_ENV
          echo "ZIG_SYSTEM_INCLUDE_FLAGS=-I/usr/riscv64-linux-gnu/include -I/usr/include/riscv64-linux-gnu" >> $GITHUB_ENV

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sqlite openssl
          echo "SQLITE3_DIR=$(brew --prefix sqlite)" >> $GITHUB_ENV
          echo "OPENSSL_DIR=$(brew --prefix openssl)" >> $GITHUB_ENV

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install sqlite openssl -y
          # Set environment variables for Zig to find Windows libraries
          echo "ZIG_SYSTEM_LINKER_FLAGS=-L\"C:\ProgramData\chocolatey\lib\sqlite\tools\" -L\"C:\ProgramData\chocolatey\lib\openssl\tools\"" >> $GITHUB_ENV
          echo "ZIG_SYSTEM_INCLUDE_FLAGS=-I\"C:\ProgramData\chocolatey\lib\sqlite\tools\include\" -I\"C:\ProgramData\chocolatey\lib\openssl\tools\include\"" >> $GITHUB_ENV

      - name: Build for ${{ matrix.target }}
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            export ZIG_SYSTEM_LINKER_FLAGS="-L$(brew --prefix sqlite)/lib -L$(brew --prefix openssl)/lib"
            export ZIG_SYSTEM_INCLUDE_FLAGS="-I$(brew --prefix sqlite)/include -I$(brew --prefix openssl)/include"
          fi
          # For Linux cross-compilation (aarch64, riscv64), static linking is handled in build.zig
          zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.zig_target }}
          if [[ "${{ matrix.zig_target }}" == *"windows"* ]]; then
            mv zig-out/bin/yourpost.exe yourpost-${{ matrix.target }}.exe
          else
            mv zig-out/bin/yourpost yourpost-${{ matrix.target }}
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: yourpost-${{ matrix.target }}
          path: yourpost-${{ matrix.target }}*
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -la artifacts/*/

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Upload Release Assets
        run: |
          for binary in artifacts/*/yourpost-*; do
            gh release upload ${{ github.ref_name }} "$binary"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
