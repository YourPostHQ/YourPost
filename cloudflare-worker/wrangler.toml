name = "yourpost"
main = "email-worker.js"
compatibility_date = "2024-01-01"

# Set your yourpost endpoint
[vars]
YOURPOST_URL = "https://yourpost.privatedata.center"

# Or use secrets (recommended):
# wrangler secret put YOURPOST_URL

# Email bindings (if using email routing)
# [email]
# name = "YOURPOST_EMAIL"

[[routes]]
type = "email"
pattern = "*@privatedata.center"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1